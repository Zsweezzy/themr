[package]
name = "themr"
version = "0.1.0"
edition = "2024"
description = "One window to set the color theme of every app on your desktop"
license = "MIT"
repository = "https://github.com/Zsweezzy/themr"
readme = "README.md"

[dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
